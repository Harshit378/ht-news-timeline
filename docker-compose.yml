services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline
      POSTGRES_DB: timeline
    ports:
      - "5432:5432"
    volumes:
      - timeline_pg:/var/lib/postgresql/data

  # Only needed when running more than one API instance (ADR-005 fan-out): docker compose --profile scale up -d
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["scale"]
    ports:
      - "6379:6379"

volumes:
  timeline_pg:
