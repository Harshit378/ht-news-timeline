<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Offline · News Timeline</title>
    <style>
      :root {
        --bg: #0a0a0b;
        --surface: #111113;
        --border: #222226;
        --accent: #e83a2e;
        --text: #f0ede8;
        --muted: #7a7878;
        --gold: #c9a84c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f3ee;
          --surface: #fbf9f5;
          --border: #e2ddd3;
          --accent: #d0302a;
          --text: #1a1a1a;
          --muted: #6b665e;
          --gold: #9a7a28;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 360px;
        width: 100%;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        padding: 24px;
        text-align: center;
      }
      .kicker {
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
      }
      h1 { font-family: Georgia, ui-serif, serif; font-size: 24px; margin: 8px 0 12px; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }
      .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      a, button {
        min-height: 44px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
        text-decoration: none;
        cursor: pointer;
      }
      button { border: 0; background: var(--accent); color: #fff; }
      a { border: 1px solid var(--border); color: var(--text); }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">No connection</div>
      <h1>You're offline</h1>
      <p>This page wasn't saved for offline reading. Your saved stories are still available.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/bookmarks/">Saved stories</a>
      </div>
    </main>
  </body>
</html>
